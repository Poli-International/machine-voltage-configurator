    <script>
if (window.self !== window.top) {
    var poliRoot = document.documentElement;
    var poliApply = function (light) {
        poliRoot.setAttribute('data-theme', light ? 'light' : 'dark');
        var b = document.body;
        if (b) {
            b.classList.toggle('dark-mode', !light);
            b.classList.toggle('light-mode', !!light);
        }
    };
    poliApply(false);
    document.addEventListener('DOMContentLoaded', function () {
        poliApply(poliRoot.getAttribute('data-theme') === 'light');
    });
    window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'poli-theme') {
            poliApply(!!e.data.light);
        }
    });
}
</script>

    // Tool Tabs Functionality
    document.querySelectorAll('.tool-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tool-tab').forEach(t => {
                t.style.background = '#222';
                t.style.color = '#ccc';
            });
            tab.style.background = '#3B82F6';
            tab.style.color = '#fff';
            const tabName = tab.dataset.tab;
            document.querySelectorAll('.wrapper-tab-content').forEach(content => {
                content.style.display = 'none';
            });
            document.getElementById('tab-' + tabName).style.display = 'block';
        });
    });
    function copyEmbedCode() {
        const textarea = document.getElementById('embedCodeTab');
        textarea.select();
        document.execCommand('copy');
        alert('Copied to clipboard!');
    }
